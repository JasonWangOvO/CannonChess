[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cannonchess"
version = "0.1.0"
description = "CannonChess local two-player prototype"
requires-python = ">=3.10"

[project.scripts]
cannonchess = "cannonchess.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
